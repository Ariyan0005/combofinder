<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <!-- Background of squircle app tile (Dark Indigo/Purple) -->
    <radialGradient id="tileBg" cx="50%" cy="30%" r="75%">
      <stop offset="0%" stop-color="#381369" />
      <stop offset="45%" stop-color="#230947" />
      <stop offset="85%" stop-color="#14032c" />
      <stop offset="100%" stop-color="#0c011d" />
    </radialGradient>

    <!-- Squircle Rim highlight -->
    <linearGradient id="tileBorder" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd" stop-opacity="0.6" />
      <stop offset="50%" stop-color="#5a189a" stop-opacity="0.2" />
      <stop offset="100%" stop-color="#10002b" stop-opacity="0.8" />
    </linearGradient>

    <!-- Top Left Purple Hex Section (Vibrant Neon Purple/Magenta) -->
    <linearGradient id="purpleTop" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="40%" stop-color="#9d4edd" />
      <stop offset="80%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#560bad" />
    </linearGradient>

    <linearGradient id="purpleSheen" x1="0%" y1="0%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#f72585" stop-opacity="0.8" />
      <stop offset="40%" stop-color="#c77dff" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#7209b7" stop-opacity="0" />
    </linearGradient>

    <!-- Right White-Silver Metallic Hex Section -->
    <linearGradient id="whiteMain" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="30%" stop-color="#f8fafc" />
      <stop offset="70%" stop-color="#e2e8f0" />
      <stop offset="100%" stop-color="#cbd5e1" />
    </linearGradient>

    <linearGradient id="whiteBevel" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#94a3b8" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Floating Center 3D Isometric Cube -->
    <linearGradient id="cubeTopGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#b5179e" />
      <stop offset="100%" stop-color="#8338ec" />
    </linearGradient>

    <linearGradient id="cubeLeftGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#560bad" />
      <stop offset="100%" stop-color="#3a0ca3" />
    </linearGradient>

    <linearGradient id="cubeRightGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#7209b7" />
      <stop offset="100%" stop-color="#480ca8" />
    </linearGradient>

    <!-- 3D Shadow Filters -->
    <filter id="tileShadow" x="-10%" y="-10%" width="120%" height="120%">
      <feDropShadow dx="0" dy="25" stdDeviation="30" flood-color="#000000" flood-opacity="0.8" />
    </filter>

    <filter id="emblemShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="20" stdDeviation="16" flood-color="#000000" flood-opacity="0.6" />
      <feDropShadow dx="0" dy="8" stdDeviation="8" flood-color="#140226" flood-opacity="0.9" />
    </filter>

    <filter id="cubeShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="16" stdDeviation="12" flood-color="#06010f" flood-opacity="0.95" />
    </filter>
  </defs>

  <!-- 1. Background Rounded Tile (Edge-to-Edge with Smooth Bevel) -->
  <g filter="url(#tileShadow)">
    <rect x="32" y="32" width="960" height="960" rx="260" fill="url(#tileBg)" />
    <rect x="32" y="32" width="960" height="960" rx="260" fill="none" stroke="url(#tileBorder)" stroke-width="6" />
    <!-- Soft Top Light Glow -->
    <ellipse cx="512" cy="120" rx="350" ry="80" fill="#9d4edd" opacity="0.15" />
  </g>

  <!-- 2. Dual-Tone 3D Hexagonal Loop Emblem -->
  <g filter="url(#emblemShadow)">

    <!-- Deep Bevel & Extrusion Base -->
    <path d="M 512 185 L 810 357 L 810 702 L 512 875 L 214 702 L 214 357 Z" fill="#0c011a" opacity="0.6" transform="translate(0, 16)" />

    <!-- A. TOP-LEFT PURPLE BLADE -->
    <!-- Purple Bottom/Side Shadow -->
    <path d="M 214 357 L 512 185 L 660 270 L 590 310 L 470 240 L 305 335 L 305 660 L 214 702 Z" fill="#240046" />
    
    <!-- Purple Front Face -->
    <path d="M 512 185 L 660 270 L 590 310 L 465 238 L 305 330 L 305 660 L 214 702 L 214 357 Z" fill="url(#purpleTop)" />

    <!-- Purple Inner Bevel Wall -->
    <path d="M 305 330 L 465 238 L 465 315 L 350 380 L 350 620 L 305 660 Z" fill="#480ca8" />

    <!-- Purple Gloss Highlight Ridge -->
    <path d="M 512 185 L 660 270 L 640 282 L 512 205 L 225 368 L 214 357 Z" fill="url(#purpleSheen)" />

    <!-- B. BOTTOM-RIGHT WHITE-SILVER BLADE -->
    <!-- White Bottom Extrusion Shadow -->
    <path d="M 810 357 L 810 702 L 512 875 L 364 790 L 434 750 L 559 822 L 719 730 L 719 400 Z" fill="#334155" />

    <!-- White Main Front Surface -->
    <path d="M 512 340 L 810 168 L 810 702 L 512 875 L 364 790 L 434 750 L 559 822 L 719 730 L 719 400 L 585 322 Z" fill="url(#whiteMain)" />

    <!-- White Inner Bevel Step -->
    <path d="M 719 400 L 585 322 L 585 390 L 670 440 L 670 675 L 719 730 Z" fill="url(#whiteBevel)" />

    <!-- Pure White Edge Rim Highlight -->
    <path d="M 810 168 L 810 180 L 585 334 L 512 352 L 512 340 L 585 322 Z" fill="#ffffff" />
  </g>

  <!-- 3. Floating 3D Center Cube -->
  <g filter="url(#cubeShadow)">
    <!-- Top Face -->
    <polygon points="512,400 598,450 512,500 426,450" fill="url(#cubeTopGrad)" />
    
    <!-- Left Face -->
    <polygon points="426,450 512,500 512,600 426,550" fill="url(#cubeLeftGrad)" />
    
    <!-- Right Face -->
    <polygon points="512,500 598,450 598,550 512,600" fill="url(#cubeRightGrad)" />

    <!-- Crisp Highlight Lines -->
    <polyline points="426,450 512,400 598,450" fill="none" stroke="#f72585" stroke-width="4" stroke-linecap="round" />
    <line x1="512" y1="500" x2="512" y2="600" stroke="#c77dff" stroke-width="3" opacity="0.8" />
  </g>
</svg>
